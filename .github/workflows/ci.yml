# 라이브러리·공유 샘플 코드의 빌드·테스트와 경계 검사(#6).
# 웹 e2e, iOS 앱 UI 테스트, Android 에뮬레이터 계측 테스트까지 돌린다.
# 바뀐 경로에 따라 필요한 잡만 돈다(changes 잡). 문서만 바뀌면 changes 잡 하나로 끝난다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 바뀐 경로로 돌릴 잡을 정한다. 라이브러리(`Sources` 등)와 워크플로가 바뀌면 모든 잡이 돈다.
  # 문서(`docs/**`, `*.md`)와 `Spikes/**`는 어느 필터에도 없어 아무 잡도 돌리지 않는다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      boundaries: ${{ steps.filter.outputs.boundaries }}
      library: ${{ steps.filter.outputs.library }}
      api: ${{ steps.filter.outputs.api }}
      shared: ${{ steps.filter.outputs.shared }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            all: &all
              - '.github/**'
              - 'Package.swift'
              - 'Sources/**'
              - 'Plugins/**'
            library:
              - *all
              - 'Tests/**'
              - 'Samples/LoginShared/**'
            api:
              - *all
              - 'api/**'
              - 'scripts/check-api.sh'
            boundaries:
              - *all
              - 'Samples/**'
              - 'scripts/check-sample-boundaries.sh'
            shared:
              - *all
              - 'Samples/TodoModular/Shared/**'
            web:
              - *all
              - 'Samples/LoginShared/**'
              - 'Samples/TodoModular/Shared/**'
              - 'Samples/TodoModular/Web/**'
              - 'Samples/WebLogin/**'
            ios:
              - *all
              - 'Samples/LoginShared/**'
              - 'Samples/TodoModular/Shared/**'
              - 'Samples/TodoModular/iOS/**'
              - 'Samples/iOSLogin/**'
            android:
              - *all
              - 'Samples/LoginShared/**'
              - 'Samples/TodoModular/Shared/**'
              - 'Samples/TodoModular/Android/**'
              - 'Samples/AndroidLogin/**'

  # 빌드가 필요 없는 검사. 어느 호스트에서나 돈다.
  boundaries:
    needs: changes
    if: needs.changes.outputs.boundaries == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 샘플 모듈 경계
        run: scripts/check-sample-boundaries.sh
      # ADR-0004: Sources/RIBs는 표준 라이브러리와 _Concurrency만 쓴다(AGENTS.md).
      - name: RIBs 코어 import 제한
        run: |
          violations=$(grep -rnE '^\s*(@[A-Za-z_]+(\([^)]*\))?\s+)*import\s+((struct|class|enum|protocol|func|var|let|typealias)\s+)?[A-Za-z_]' Sources/RIBs \
            | grep -vE 'import\s+((struct|class|enum|protocol|func|var|let|typealias)\s+)?(Swift|_Concurrency)(\.|\s|$)' || true)
          if [ -n "$violations" ]; then
            echo "Sources/RIBs는 Swift 표준 라이브러리와 _Concurrency만 import한다(ADR-0004):"
            echo "$violations"
            exit 1
          fi

  linux:
    needs: changes
    if: needs.changes.outputs.library == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@v7
      - name: 라이브러리 빌드·테스트
        run: swift build && swift test
      - name: TodoModular 공유 패키지 빌드·테스트
        working-directory: Samples/TodoModular/Shared
        run: swift build && swift test

  # 공개 API 덤프 비교(ADR-0011). 덤프 표현은 Xcode의 Swift 버전에 따라 달라질 수 있어(docs/building.md)
  # 덤프를 만든 Xcode와 러너의 Xcode가 다르면 API가 같아도 실패한다.
  macos:
    needs: changes
    if: needs.changes.outputs.library == 'true' || needs.changes.outputs.api == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Xcode·Swift 버전
        run: xcodebuild -version && swift --version
      - name: 라이브러리 빌드·테스트
        run: swift build && swift test
      - name: 공개 API 검사
        run: scripts/check-api.sh

  # 웹 샘플(TodoModular, WebLogin)의 Wasm 빌드와 e2e. docs/building.md "WSL에서 빌드"와 같은 구성이다.
  # Puppeteer의 Chrome은 root로 뜨지 않아 swift 컨테이너 대신 러너(일반 사용자)에 툴체인을 설치한다.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WASM_SDK: swift-6.4.2-RELEASE_wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Samples/TodoModular/Web/package-lock.json
            Samples/WebLogin/package-lock.json
      # Wasm SDK checksum은 download.swift.org 파일에서 계산한 값이다(docs/building.md).
      - uses: ./.github/actions/setup-swift-linux
        with:
          sdks: wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
      # Ubuntu 24.04는 비특권 사용자 네임스페이스를 AppArmor로 막아 Chrome 샌드박스가 뜨지 않는다.
      - name: Chrome 샌드박스 허용
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: TodoModular 웹 e2e
        working-directory: Samples/TodoModular/Web
        run: |
          swift package --swift-sdk "$WASM_SDK" js
          npm ci
          npm run test:e2e
      - name: WebLogin e2e
        working-directory: Samples/WebLogin
        run: |
          swift package --swift-sdk "$WASM_SDK" js
          npm ci
          npm run test:e2e

  # iOS 샘플(TodoModular, iOSLogin). Tuist로 프로젝트를 만들고 시뮬레이터에서 UI 테스트를 돌린다.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            tuist = "4.191.5"
      - name: 시뮬레이터 고르기
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if ".iOS-" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "SIMULATOR=id=$udid" >> "$GITHUB_ENV"
      - name: TodoModular 생성
        working-directory: Samples/TodoModular/iOS
        run: tuist generate --no-open
      # UI 테스트는 실패한 테스트만 한 번 더 돌린다. 두 번 다 실패해야 잡이 실패한다.
      # 재시도로 통과해도 로그의 "Test Case ... failed"로 흔들림을 알 수 있고, 결과 번들은 실패 시 올린다.
      - name: TodoModular UI 테스트
        working-directory: Samples/TodoModular/iOS
        run: >-
          xcodebuild test -workspace TodoModular.xcworkspace -scheme TodoModular -destination "$SIMULATOR"
          -retry-tests-on-failure -test-iterations 2 -resultBundlePath "$RUNNER_TEMP/TodoModularUITests.xcresult"
      - name: TodoModular 전송 테스트
        working-directory: Samples/TodoModular/iOS
        run: >-
          xcodebuild test -workspace TodoModular.xcworkspace -scheme TodoTransport -destination "$SIMULATOR"
          -only-testing:TodoTransportTests
      - name: 피처 Example 앱 빌드
        working-directory: Samples/TodoModular/iOS
        run: |
          for scheme in FeatureLoggedInExample FeatureLoggedOutExample FeatureTodoDetailExample FeatureTodoListExample; do
            xcodebuild build -workspace TodoModular.xcworkspace -scheme "$scheme" -destination "$SIMULATOR"
          done
      - name: iOSLogin UI 테스트
        working-directory: Samples/iOSLogin
        run: |
          tuist generate --no-open
          xcodebuild test -workspace LoginSample.xcworkspace -scheme LoginSample -destination "$SIMULATOR" \
            -retry-tests-on-failure -test-iterations 2 -resultBundlePath "$RUNNER_TEMP/LoginSampleUITests.xcresult"
      - name: 실패한 UI 테스트 결과 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-results
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Android 샘플(TodoModular, AndroidLogin). Swift 호스트 테스트 뒤 x86_64 에뮬레이터에서 계측 테스트를 돌린다.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Swift 교차 빌드(.build)가 APK 빌드 시간의 대부분이다. 소스가 바뀌어도 이전 결과를 받아 증분 빌드한다.
      - uses: actions/cache@v6
        with:
          path: |
            Samples/TodoModular/Android/swift/.build
            Samples/AndroidLogin/app/src/main/swift/.build
          key: android-swift-${{ hashFiles('Samples/TodoModular/Android/swift/Package.swift', 'Samples/AndroidLogin/app/src/main/swift/Package.swift') }}-${{ github.sha }}
          # Package.resolved는 체크인하지 않아(.gitignore) 의존성 버전을 고정한 Package.swift로 키를 만든다.
          restore-keys: |
            android-swift-${{ hashFiles('Samples/TodoModular/Android/swift/Package.swift', 'Samples/AndroidLogin/app/src/main/swift/Package.swift') }}-
            android-swift-
      - uses: ./.github/actions/setup-swift-linux
        with:
          sdks: android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
      - name: NDK 설치와 Swift SDK 연결
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          # SwiftPM은 ~/.swiftpm이 없으면 ~/.config/swiftpm 아래에 SDK를 설치한다. bridge/build.gradle.kts와 같은 후보를 본다.
          bundle=$(ls -d ~/.swiftpm/swift-sdks/swift-6.4.2-RELEASE_android.artifactbundle \
            ~/.config/swiftpm/swift-sdks/swift-6.4.2-RELEASE_android.artifactbundle 2>/dev/null | head -1)
          [ -n "$bundle" ] || { echo "Android Swift SDK를 찾지 못했습니다"; exit 1; }
          ANDROID_NDK_HOME="$ndk" bash "$bundle/swift-android/scripts/setup-android-sdk.sh"
      - name: TodoModular Android Swift 호스트 테스트
        working-directory: Samples/TodoModular/Android/swift
        run: swift test --disable-sandbox
      - name: 앱·계측 테스트 APK 빌드
        run: |
          (cd Samples/TodoModular/Android && ./gradlew assembleDebug assembleDebugAndroidTest -PswiftAbis=x86_64)
          (cd Samples/AndroidLogin && ./gradlew assembleDebug assembleDebugAndroidTest -PswiftAbis=x86_64)
      - name: KVM 허용
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터 계측 테스트
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            cd Samples/TodoModular/Android && ./gradlew connectedDebugAndroidTest -PswiftAbis=x86_64
            cd Samples/AndroidLogin && ./gradlew connectedDebugAndroidTest -PswiftAbis=x86_64
