name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: 공개 API 덤프 비교(api/, ADR-0011)
        run: scripts/check-api.sh
      - name: DocC 문서 생성(경고를 오류로)
        run: swift package generate-documentation --target RIBs --warnings-as-errors

  windows:
    runs-on: windows-latest
    steps:
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --target RIBs
      # 종료(exit) 테스트는 #if os(macOS) || os(Linux)라 Windows에서는 빠진다.
      - run: swift test --filter RIBsTests

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Foundation 금지 검사
        run: |
          if grep -rnE '^\s*(@\w+\s+)*((public|internal|package|private|fileprivate)\s+)?import\s+(Foundation|Dispatch|Combine)\b' Sources/RIBs Samples/LoginShared/Sources; then
            echo "Foundation/Dispatch/Combine import is not allowed in the core" >&2
            exit 1
          fi
      - run: swift build
      - run: swift test

  ios-sample:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec tuist@4.191.5 -- tuist generate --no-open
        working-directory: Samples/iOSLogin
      - name: iOS 앱 빌드
        working-directory: Samples/iOSLogin
        run: xcodebuild build-for-testing -workspace LoginSample.xcworkspace -scheme LoginSample -destination 'generic/platform=iOS Simulator'

  web-sample:
    runs-on: ubuntu-24.04
    env:
      SWIFT_VERSION: 6.4.2
      WASM_SDK_CHECKSUM: 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: swift.org 툴체인 설치
        run: |
          curl -fsSL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz" -o swift.tar.gz
          mkdir -p "$HOME/swift" && tar -xzf swift.tar.gz -C "$HOME/swift" --strip-components=1
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Wasm Swift SDK 설치
        run: |
          swift --version
          swift sdk install "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz" --checksum "$WASM_SDK_CHECKSUM"
      - name: Wasm 샘플 빌드
        working-directory: Samples/WebLogin
        run: swift package --swift-sdk "swift-${SWIFT_VERSION}-RELEASE_wasm" js
      - run: npm ci
        working-directory: Samples/WebLogin
      - name: 헤드리스 Chrome E2E
        working-directory: Samples/WebLogin
        run: npm run test:e2e

  android:
    runs-on: ubuntu-24.04
    env:
      SWIFT_VERSION: 6.4.2
      ANDROID_SDK_CHECKSUM: 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
      NDK_VERSION: r30
    steps:
      - uses: actions/checkout@v4
      - name: swift.org 툴체인 설치
        run: |
          curl -fsSL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz" -o swift.tar.gz
          mkdir -p "$HOME/swift" && tar -xzf swift.tar.gz -C "$HOME/swift" --strip-components=1
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Android Swift SDK·NDK 설치
        run: |
          swift sdk install "https://download.swift.org/swift-${SWIFT_VERSION}-release/android-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle.tar.gz" --checksum "$ANDROID_SDK_CHECKSUM"
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o ndk.zip
          unzip -q ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: SDK를 NDK에 연결
        run: |
          bundle="$(find "$HOME" -maxdepth 4 -type d -name "swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle" | head -1)"
          test -n "$bundle"
          "$bundle/swift-android/scripts/setup-android-sdk.sh"
      - name: 호스트 테스트(RIBsAndroid, 샘플 화면 객체)
        run: |
          swift test --filter RIBsAndroidTests
          swift test --package-path Samples/AndroidLogin/app/src/main/swift
      - name: Android용 Swift 빌드(arm64-v8a, x86_64)
        working-directory: Samples/AndroidLogin/app/src/main/swift
        run: |
          swift build --swift-sdk aarch64-unknown-linux-android28 --static-swift-stdlib
          swift build --swift-sdk x86_64-unknown-linux-android28 --static-swift-stdlib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: APK 빌드
        working-directory: Samples/AndroidLogin
        env:
          SWIFT_EXEC: swift
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PswiftAbis=x86_64
