# 라이브러리·공유 샘플 코드의 빌드·테스트와 경계 검사(#6).
# 웹 샘플은 e2e까지 돌린다. iOS(Xcode)·Android(Gradle) 앱은 아직 돌리지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 빌드가 필요 없는 검사. 어느 호스트에서나 돈다.
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 샘플 모듈 경계
        run: scripts/check-sample-boundaries.sh
      # ADR-0004: Sources/RIBs는 표준 라이브러리와 _Concurrency만 쓴다(AGENTS.md).
      - name: RIBs 코어 import 제한
        run: |
          violations=$(grep -rnE '^\s*(@[A-Za-z_]+(\([^)]*\))?\s+)*import\s+((struct|class|enum|protocol|func|var|let|typealias)\s+)?[A-Za-z_]' Sources/RIBs \
            | grep -vE 'import\s+((struct|class|enum|protocol|func|var|let|typealias)\s+)?(Swift|_Concurrency)(\.|\s|$)' || true)
          if [ -n "$violations" ]; then
            echo "Sources/RIBs는 Swift 표준 라이브러리와 _Concurrency만 import한다(ADR-0004):"
            echo "$violations"
            exit 1
          fi

  linux:
    runs-on: ubuntu-latest
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@v7
      - name: 라이브러리 빌드·테스트
        run: swift build && swift test
      - name: TodoModular 공유 패키지 빌드·테스트
        working-directory: Samples/TodoModular/Shared
        run: swift build && swift test

  # 공개 API 덤프 비교(ADR-0011). 덤프 표현은 Xcode의 Swift 버전에 따라 달라질 수 있어(docs/building.md)
  # 덤프를 만든 Xcode와 러너의 Xcode가 다르면 API가 같아도 실패한다.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Xcode·Swift 버전
        run: xcodebuild -version && swift --version
      - name: 라이브러리 빌드·테스트
        run: swift build && swift test
      - name: 공개 API 검사
        run: scripts/check-api.sh

  # 웹 샘플(TodoModular, WebLogin)의 Wasm 빌드와 e2e. docs/building.md "WSL에서 빌드"와 같은 구성이다.
  # Puppeteer의 Chrome은 root로 뜨지 않아 swift 컨테이너 대신 러너(일반 사용자)에 툴체인을 설치한다.
  web:
    runs-on: ubuntu-24.04
    env:
      SWIFT_VERSION: 6.4.2
      # download.swift.org의 swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz에서 계산한 값(docs/building.md)
      WASM_SDK_CHECKSUM: 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Samples/TodoModular/Web/package-lock.json
            Samples/WebLogin/package-lock.json
      - name: Swift 툴체인과 Wasm SDK 설치
        run: |
          base="https://download.swift.org/swift-${SWIFT_VERSION}-release"
          curl -fsSL "$base/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04/usr/bin/swift" sdk install \
            "$base/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum "$WASM_SDK_CHECKSUM"
      # Ubuntu 24.04는 비특권 사용자 네임스페이스를 AppArmor로 막아 Chrome 샌드박스가 뜨지 않는다.
      - name: Chrome 샌드박스 허용
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: TodoModular 웹 e2e
        working-directory: Samples/TodoModular/Web
        run: |
          swift package --swift-sdk "swift-${SWIFT_VERSION}-RELEASE_wasm" js
          npm ci
          npm run test:e2e
      - name: WebLogin e2e
        working-directory: Samples/WebLogin
        run: |
          swift package --swift-sdk "swift-${SWIFT_VERSION}-RELEASE_wasm" js
          npm ci
          npm run test:e2e
