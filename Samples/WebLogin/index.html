<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIBs Web Login</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    [hidden] { display: none !important; }
    #errorLabel { color: #c00; }
    ul { list-style: none; padding: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- PackageToJS 출력이 bare import하는 WASI shim을 npm으로 받은 로컬 파일에 연결한다(CDN 없이 재현). -->
  <script type="importmap">
    { "imports": { "@bjorn3/browser_wasi_shim": "./node_modules/@bjorn3/browser_wasi_shim/dist/index.js" } }
  </script>
  <script type="module">
    import { init } from "./.build/plugins/PackageToJS/outputs/Package/index.js";
    import { LoggedOutView } from "./views/logged-out-view.js";
    import { LoggedInView } from "./views/logged-in-view.js";
    import { TodoListView } from "./views/todo-list-view.js";
    import { TodoDetailView } from "./views/todo-detail-view.js";
    // 화면은 JS 뷰가 그린다. Swift가 정의한 화면별 브리지 프로토콜을 구현한 객체를 넘겨 앱을 시작한다.
    const { exports } = await init();
    exports.startLoginApp(new LoggedOutView(), new LoggedInView(), new TodoListView(), new TodoDetailView());
  </script>
</body>
</html>
